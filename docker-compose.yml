version: '3.8'

services:
  lifehub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifehub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INSTANCE_CONFIG_PATH=/data/instance.yaml
    volumes:
      - lifehub_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/core/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  lifehub_data:
    driver: local
